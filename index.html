<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIITS | Smart Timetable</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },
                        brand: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-up-banner': 'slideUpBanner 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'blob': 'blob 10s infinite alternate',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideUpBanner: { '0%': { opacity: '0', transform: 'translateY(100px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        blob: { '0%': { transform: 'translate(0px, 0px) scale(1)' }, '100%': { transform: 'translate(30px, -50px) scale(1.1)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030712; overflow-x: hidden; }
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #030712; }
        .blob-1 { position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; filter: blur(60px); animation: blob 15s infinite alternate; }
        .blob-2 { position: absolute; bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; filter: blur(80px); animation: blob 12s infinite alternate-reverse; }
        
        .glass-panel { background: rgba(17, 24, 39, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .glass-card { background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(255,255,255,0.05); transition: transform 0.2s, box-shadow 0.2s; }
        .glass-card:hover { transform: translateY(-2px); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.1); }
        
        .hide { display: none !important; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #toast { transition: opacity 0.3s, transform 0.3s; transform: translateY(20px); opacity: 0; }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans antialiased flex flex-col selection:bg-brand-500 selection:text-white">

    <div class="ambient-bg">
        <div class="blob-1"></div>
        <div class="blob-2"></div>
    </div>

    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[200] glass-panel px-6 py-3 rounded-full flex items-center gap-3 border-brand-500/50 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg" class="text-sm font-bold tracking-wide"></span>
    </div>

    <!-- Vacant Room Modal -->
    <div id="room-modal" class="hide fixed inset-0 z-[300] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 md:p-8 shadow-2xl border border-gray-700/50 relative">
            <button id="close-room-modal" class="absolute top-5 right-5 text-gray-500 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 class="text-2xl font-extrabold mb-1 tracking-tight text-white"><i class="fa-solid fa-door-open mr-2 text-brand-400"></i>Vacant Rooms</h2>
            <p class="text-xs text-gray-400 mb-6">Find empty classrooms for club meetings or self-study.</p>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider pl-1">Select Day</label>
                    <select id="room-day-select" class="w-full bg-gray-900/80 border border-gray-700/50 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-brand-500 transition-colors cursor-pointer appearance-none">
                        <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option><option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider pl-1">Time Slot</label>
                    <select id="room-time-select" class="w-full bg-gray-900/80 border border-gray-700/50 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-brand-500 transition-colors cursor-pointer appearance-none">
                        <!-- Populated by JS -->
                    </select>
                </div>
            </div>
            
            <div class="bg-gray-950/50 rounded-2xl p-4 border border-white/5 min-h-[150px]">
                <div class="flex items-center justify-between mb-3 border-b border-gray-800 pb-2">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Available Rooms</span>
                    <span id="room-count" class="bg-brand-500/20 text-brand-400 text-[10px] font-bold px-2 py-0.5 rounded border border-brand-500/20">0</span>
                </div>
                <div id="vacant-room-list" class="flex flex-wrap gap-2">
                    <div class="w-full text-center py-6 text-gray-500 text-sm font-medium"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Select a time slot</div>
                </div>
            </div>
        </div>
    </div>

    <div id="install-banner" class="hide fixed bottom-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[400px] z-[100] glass-panel rounded-2xl p-4 flex items-center justify-between shadow-2xl border border-brand-500/30 animate-slide-up-banner bg-gray-900/90">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center shadow-lg flex-shrink-0">
                <i class="fa-solid fa-download text-white"></i>
            </div>
            <div>
                <h3 class="text-sm font-bold text-white tracking-wide">Install App</h3>
                <p class="text-[11px] text-gray-400">Add to home screen for offline use</p>
            </div>
        </div>
        <div class="flex gap-1 items-center">
            <button id="close-install-btn" class="p-2 text-gray-500 hover:text-white transition-colors h-10 w-10 rounded-lg"><i class="fa-solid fa-xmark"></i></button>
            <button id="install-btn" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold py-2.5 px-4 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all uppercase tracking-wider">Install</button>
        </div>
    </div>

    <div id="login-screen" class="hide flex flex-col items-center justify-center min-h-screen px-4 animate-fade-in relative z-10">
        <div class="glass-panel p-8 md:p-10 rounded-3xl w-full max-w-md text-center border-t border-t-brand-500/50 relative overflow-hidden shadow-2xl">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-brand-500 rounded-b-full shadow-[0_0_20px_rgba(59,130,246,0.8)]"></div>
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-brand-500/20 to-indigo-600/20 rounded-2xl flex items-center justify-center mb-6 border border-white/5">
                <i class="fa-solid fa-bolt text-4xl text-transparent bg-clip-text bg-gradient-to-br from-brand-400 to-indigo-400"></i>
            </div>
            <h1 class="text-3xl font-extrabold mb-2 tracking-tight">Smart Timetable</h1>
            <p class="text-gray-400 mb-8 text-sm font-medium">Sync your academic schedule instantly.</p>
            
            <form id="login-form" class="space-y-5">
                <div class="relative group">
                    <i class="fa-solid fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-brand-400 transition-colors"></i>
                    <input type="text" id="roll-input" placeholder="Roll Number (e.g., S202600xxxxx)" required
                        class="w-full pl-11 pr-4 py-4 bg-gray-950/50 border border-gray-700/50 rounded-xl focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 outline-none transition-all text-white placeholder-gray-600 uppercase font-mono text-sm tracking-wider shadow-inner">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold py-4 px-4 rounded-xl transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_30px_rgba(37,99,235,0.5)] flex items-center justify-center gap-2 group">
                    Access Dashboard <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </button>
                <p id="error-msg" class="text-red-400 text-sm mt-2 hide bg-red-900/20 py-2.5 rounded-xl border border-red-500/20 font-medium"></p>
            </form>
        </div>
        <div class="absolute bottom-8 text-[11px] text-gray-600 font-bold tracking-[0.2em] opacity-60 uppercase">Created by Vasudevan M</div>
    </div>

    <div id="dashboard-screen" class="hide flex flex-col min-h-screen animate-fade-in z-10">
        
        <nav class="glass-panel sticky top-0 z-50 px-4 md:px-8 py-3 flex justify-between items-center border-b border-gray-800/50">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center shadow-lg relative group cursor-pointer" id="share-btn">
                    <i class="fa-solid fa-share-nodes text-white text-lg group-hover:scale-110 transition-transform"></i>
                    <span class="absolute -bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-xs py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Share Day</span>
                </div>
                <!-- New Room Finder Button -->
                <button id="open-room-finder" class="w-10 h-10 rounded-xl bg-gray-800/80 hover:bg-white/10 flex items-center justify-center border border-gray-700/50 transition-all group">
                    <i class="fa-solid fa-door-open text-gray-400 group-hover:text-brand-400 transition-colors"></i>
                </button>
                <div class="ml-2">
                    <h1 class="text-xl font-bold tracking-tight hidden sm:block leading-none mb-1">IIITS Schedule</h1>
                    <div id="live-clock" class="text-xs font-mono text-brand-400 font-bold tracking-widest hidden sm:block"></div>
                </div>
            </div>

            <div class="hidden md:flex bg-gray-900/80 border border-gray-700/50 p-1 rounded-lg">
                <button id="view-focus-btn" class="px-4 py-1.5 rounded-md text-sm font-bold bg-gray-700 text-white shadow transition-all">Focus Mode</button>
                <button id="view-grid-btn" class="px-4 py-1.5 rounded-md text-sm font-bold text-gray-400 hover:text-white transition-all">Grid Mode</button>
            </div>
            
            <div class="flex items-center gap-4 md:gap-6">
                <button id="notify-btn" class="text-gray-400 hover:text-yellow-400 transition-colors relative group">
                    <i class="fa-solid fa-bell text-lg"></i>
                </button>
                <div class="text-right flex flex-col items-end">
                    <span id="user-name" class="font-bold text-sm md:text-base bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400"></span>
                    <span id="user-details" class="text-[10px] font-mono text-brand-400 font-bold tracking-widest bg-brand-900/30 px-2 py-0.5 rounded border border-brand-500/20 mt-0.5"></span>
                </div>
                <button id="logout-btn" class="bg-gray-800/80 hover:bg-red-500/20 hover:border-red-500/50 hover:text-red-400 text-gray-400 h-10 w-10 rounded-xl transition-all border border-gray-700/50 flex items-center justify-center group">
                    <i class="fa-solid fa-power-off group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
        </nav>

        <main class="flex-grow p-4 md:p-6 lg:p-8 w-full max-w-[100%] mx-auto flex flex-col">
            
            <div class="mb-5 mt-2 flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                    <h2 id="greeting-text" class="text-3xl md:text-4xl font-extrabold tracking-tight mb-1"></h2>
                    <p id="status-text" class="text-gray-400 font-medium"></p>
                </div>
                
                <div class="md:hidden flex bg-gray-900/80 border border-gray-700/50 p-1 rounded-lg w-fit">
                    <button id="mobile-view-focus" class="px-4 py-1.5 rounded-md text-sm font-bold bg-gray-700 text-white shadow transition-all">Focus</button>
                    <button id="mobile-view-grid" class="px-4 py-1.5 rounded-md text-sm font-bold text-gray-400 transition-all">Grid</button>
                </div>
            </div>

            <div class="flex overflow-x-auto gap-2 md:gap-3 mb-5 pb-2 hide-scrollbar w-full border-b border-gray-800/50" id="day-tabs"></div>

            <div id="focus-container" class="space-y-2.5 md:space-y-4 max-w-4xl mx-auto w-full flex-grow"></div>
            
            <div id="grid-container" class="hide grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-2 flex-grow w-full h-full"></div>
            
            <div class="mt-8 mb-2 text-center text-[11px] text-gray-600 font-bold tracking-[0.2em] opacity-60 uppercase">Created by Vasudevan M</div>
        </main>
    </div>

    <script>
        let studentData = {}, timetableData = {}, currentUser = null, activeDay = "Monday";
        let notifiedClasses = new Set(), trackerInterval = null, clockInterval = null;
        let viewMode = 'focus'; 
        const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        // Master Room List extracted from M2026 PDF
        const CAMPUS_ROOMS = ["G04", "G05", "G06", "G07", "G08", "G09", "B03", "B04", "B05", "103", "104", "105", "108", "109", "110", "111", "112", "114/102"];
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('install-banner').classList.remove('hide'); });
        document.getElementById('close-install-btn').addEventListener('click', () => { document.getElementById('install-banner').classList.add('hide'); });
        document.getElementById('install-btn').addEventListener('click', async () => {
            document.getElementById('install-banner').classList.add('hide'); 
            if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
        });

        function showToast(msg) {
            const toast = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function initApp() {
            try {
                const [studentRes, timetableRes] = await Promise.all([ fetch('students.json'), fetch('timetable.json') ]);
                studentData = await studentRes.json(); timetableData = await timetableRes.json();
                
                const todayStr = daysOfWeek[new Date().getDay()];
                if (todayStr !== "Sunday") activeDay = todayStr;

                const savedRoll = localStorage.getItem('iiits_saved_roll');
                if (savedRoll) {
                    const student = Object.values(studentData).find(s => s.Roll && s.Roll.toUpperCase() === savedRoll);
                    if (student) {
                        currentUser = student; currentUser.CleanName = sanitizeName(currentUser.Name);
                        loadDashboard(); return; 
                    }
                }
                document.getElementById('login-screen').classList.remove('hide');
            } catch (err) { console.error("JSON Load Error", err); }
        }

        function sanitizeName(rawName) {
            if (!rawName) return "Student";
            return rawName.replace(/S202\d{7}/gi, '').replace(/\S+@\S+\.\S+/g, '').replace(/\b(ECE|CSE|AI&DS|AIDS|Sec\d+)\b/gi, '').replace(/[^a-zA-Z\s]/g, '').replace(/\s+/g, ' ').trim() || "Student";
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const rawInput = document.getElementById('roll-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            let student = null;

            if (rawInput.startsWith('?')) {
                const searchName = rawInput.substring(1).toLowerCase().trim();
                student = Object.values(studentData).find(s => s.Name && sanitizeName(s.Name).toLowerCase().includes(searchName));
            } else {
                student = Object.values(studentData).find(s => s.Roll && s.Roll.toUpperCase() === rawInput.toUpperCase());
            }
            
            if (student) {
                currentUser = student; currentUser.CleanName = sanitizeName(currentUser.Name); 
                if (!rawInput.startsWith('?')) localStorage.setItem('iiits_saved_roll', currentUser.Roll);
                errorMsg.classList.add('hide'); loadDashboard();
            } else {
                errorMsg.innerText = rawInput.startsWith('?') ? "Secret lookup failed: Name not found." : "Roll number not found.";
                errorMsg.classList.remove('hide');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            currentUser = null; localStorage.removeItem('iiits_saved_roll');
            document.getElementById('dashboard-screen').classList.add('hide'); document.getElementById('login-screen').classList.remove('hide'); document.getElementById('roll-input').value = '';
            clearInterval(trackerInterval); clearInterval(clockInterval);
        });

        function setViewMode(mode) {
            viewMode = mode;
            const isFocus = mode === 'focus';
            document.getElementById('view-focus-btn').className = `px-4 py-1.5 rounded-md text-sm font-bold transition-all ${isFocus ? 'bg-gray-700 text-white shadow' : 'text-gray-400 hover:text-white'}`;
            document.getElementById('view-grid-btn').className = `px-4 py-1.5 rounded-md text-sm font-bold transition-all ${!isFocus ? 'bg-gray-700 text-white shadow' : 'text-gray-400 hover:text-white'}`;
            document.getElementById('mobile-view-focus').className = `px-4 py-1.5 rounded-md text-sm font-bold transition-all ${isFocus ? 'bg-gray-700 text-white shadow' : 'text-gray-400'}`;
            document.getElementById('mobile-view-grid').className = `px-4 py-1.5 rounded-md text-sm font-bold transition-all ${!isFocus ? 'bg-gray-700 text-white shadow' : 'text-gray-400'}`;

            if(isFocus) {
                document.getElementById('day-tabs').classList.remove('hide'); document.getElementById('focus-container').classList.remove('hide'); document.getElementById('grid-container').classList.add('hide');
            } else {
                document.getElementById('day-tabs').classList.add('hide'); document.getElementById('focus-container').classList.add('hide'); document.getElementById('grid-container').classList.remove('hide');
            }
            renderSchedule();
        }
        
        document.getElementById('view-focus-btn').onclick = () => setViewMode('focus'); document.getElementById('view-grid-btn').onclick = () => setViewMode('grid');
        document.getElementById('mobile-view-focus').onclick = () => setViewMode('focus'); document.getElementById('mobile-view-grid').onclick = () => setViewMode('grid');

        // --- ROOM FINDER LOGIC ---
        document.getElementById('open-room-finder').addEventListener('click', () => {
            const modal = document.getElementById('room-modal');
            const timeSelect = document.getElementById('room-time-select');
            
            const allTimes = new Set();
            ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"].forEach(day => {
                const dayData = timetableData["UG1"]?.[day];
                if (dayData) Object.keys(dayData).forEach(t => allTimes.add(t));
            });
            
            timeSelect.innerHTML = '';
            Array.from(allTimes).sort().forEach(time => {
                timeSelect.innerHTML += `<option value="${time}">${time}</option>`;
            });

            document.getElementById('room-day-select').value = activeDay === 'Sunday' ? 'Monday' : activeDay;
            modal.classList.remove('hide');
            searchVacantRooms();
        });

        document.getElementById('close-room-modal').addEventListener('click', () => { document.getElementById('room-modal').classList.add('hide'); });
        document.getElementById('room-day-select').addEventListener('change', searchVacantRooms);
        document.getElementById('room-time-select').addEventListener('change', searchVacantRooms);

        function searchVacantRooms() {
            const day = document.getElementById('room-day-select').value;
            const time = document.getElementById('room-time-select').value;
            const list = document.getElementById('vacant-room-list');
            const count = document.getElementById('room-count');
            
            if (!time) return;

            let occupiedRooms = new Set();
            
            Object.keys(timetableData).forEach(batch => {
                const slots = timetableData[batch]?.[day]?.[time];
                if (slots) {
                    slots.forEach(s => {
                        if (s.room) {
                            let cleanRoom = s.room.toUpperCase().replace(/LAB\s*/i, '').trim();
                            occupiedRooms.add(cleanRoom);
                        }
                    });
                }
            });

            const vacantRooms = CAMPUS_ROOMS.filter(r => !occupiedRooms.has(r));
            
            count.innerText = vacantRooms.length;
            list.innerHTML = '';
            
            if (vacantRooms.length === 0) {
                list.innerHTML = `<div class="w-full text-center py-6 text-red-400 text-sm font-medium">Campus is completely full during this slot!</div>`;
                return;
            }

            vacantRooms.forEach(room => {
                list.innerHTML += `<div class="bg-gray-800/80 border border-gray-600/50 text-gray-300 px-3 py-1.5 rounded-lg text-sm font-mono shadow-sm"><i class="fa-solid fa-door-open mr-2 text-emerald-400"></i>${room}</div>`;
            });
        }
        // -------------------------

        function getMyClassForSlot(slots) {
            return slots.find(slot => {
                if (slot.branch === "ALL") return true;
                if (slot.branch && slot.branch !== "ALL" && slot.branch !== currentUser.Branch) return false;
                for (const [courseGrp, mySec] of Object.entries(currentUser.Sections)) {
                    if (slot.course === courseGrp || (slot.base && courseGrp.includes(slot.base))) {
                        const jsonSec = slot.section ? slot.section.replace(/\s+/g, '').replace(/Lab/i, '').toLowerCase() : "";
                        const targetSec = mySec ? mySec.toLowerCase() : "";
                        return jsonSec === targetSec;
                    }
                }
                return false;
            });
        }

        document.getElementById('share-btn').addEventListener('click', () => {
            const dayData = timetableData["UG1"]?.[activeDay];
            if(!dayData) return showToast("No classes to share!");
            let shareText = `📚 ${currentUser.CleanName.split(' ')[0]}'s Schedule (${activeDay})\n`;
            let hasClasses = false;
            Object.keys(dayData).forEach(timeStr => {
                const myClass = getMyClassForSlot(dayData[timeStr]);
                if (myClass) { hasClasses = true; shareText += `\n🕒 ${timeStr}\n📖 ${myClass.course} ${myClass.section || ''} | 📍 ${myClass.room}`; }
            });
            if(!hasClasses) shareText += "\nFree day! 🎉";
            navigator.clipboard.writeText(shareText).then(() => showToast("Schedule Copied!"));
        });

        function loadDashboard() {
            document.getElementById('login-screen').classList.add('hide');
            document.getElementById('dashboard-screen').classList.remove('hide');
            document.getElementById('user-name').innerText = currentUser.CleanName;
            document.getElementById('user-details').innerText = `${currentUser.Roll} • ${currentUser.Branch}`;

            clearInterval(clockInterval);
            clockInterval = setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }, 1000);

            setViewMode(viewMode); 
            
            clearInterval(trackerInterval);
            trackerInterval = setInterval(() => { checkUpcomingClasses(); renderSchedule(); }, 60000);
        }

        function parseTime(timeStr) {
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!match) return new Date();
            let hours = parseInt(match[1]);
            if (match[3].toUpperCase() === 'PM' && hours < 12) hours += 12;
            if (match[3].toUpperCase() === 'AM' && hours === 12) hours = 0;
            const d = new Date(); d.setHours(hours, parseInt(match[2]), 0, 0);
            return d;
        }

        function formatDuration(mins) {
            if (mins < 60) return `${mins} mins`;
            const h = Math.floor(mins / 60); const m = mins % 60;
            return m === 0 ? `${h} hr` : `${h} hr ${m} mins`;
        }

        function checkUpcomingClasses() {
            if (Notification.permission !== "granted") return;
            const currentDayStr = daysOfWeek[new Date().getDay()];
            const dayData = timetableData["UG1"]?.[currentDayStr];
            if (!dayData) return;

            Object.keys(dayData).forEach(timeStr => {
                const startTime = parseTime(timeStr.split(' - ')[0]);
                const diffMinutes = (startTime - new Date()) / 60000;
                
                if (diffMinutes > 0 && diffMinutes <= 10) {
                    const myClass = getMyClassForSlot(dayData[timeStr]);
                    if (myClass && !notifiedClasses.has(timeStr)) {
                        new Notification("Upcoming Class", { body: `${myClass.course} starts in 10 minutes at ${myClass.room}.`, icon: "icon.png" });
                        notifiedClasses.add(timeStr);
                    }
                }
            });
        }

        const colors = {
            "CP": "bg-blue-900/20 border-blue-500/30 text-blue-300 shadow-[inset_0_0_20px_rgba(59,130,246,0.05)]",
            "DLD": "bg-red-900/20 border-red-500/30 text-red-300 shadow-[inset_0_0_20px_rgba(239,68,68,0.05)]",
            "DSMA": "bg-emerald-900/20 border-emerald-500/30 text-emerald-300 shadow-[inset_0_0_20px_rgba(16,185,129,0.05)]",
            "OCW": "bg-purple-900/20 border-purple-500/30 text-purple-300 shadow-[inset_0_0_20px_rgba(168,85,247,0.05)]",
            "EE": "bg-amber-900/20 border-amber-500/30 text-amber-300 shadow-[inset_0_0_20px_rgba(245,158,11,0.05)]",
            "EDL": "bg-pink-900/20 border-pink-500/30 text-pink-300 shadow-[inset_0_0_20px_rgba(236,72,153,0.05)]",
            "FHVE": "bg-indigo-900/20 border-indigo-500/30 text-indigo-300 shadow-[inset_0_0_20px_rgba(99,102,241,0.05)]"
        };

        function renderSchedule() {
            const hour = new Date().getHours();
            document.getElementById('greeting-text').innerText = `${hour < 12 ? "Good Morning" : hour < 17 ? "Good Afternoon" : "Good Evening"}, ${currentUser.CleanName.split(' ')[0]}.`;
            renderTabs();
            if (viewMode === 'focus') renderFocusMode();
            else renderGridMode();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';
            ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"].forEach(day => {
                const isActive = day === activeDay;
                const btn = document.createElement('button');
                btn.className = `px-5 py-2 md:px-6 md:py-2.5 rounded-xl whitespace-nowrap font-bold text-xs md:text-sm transition-all flex-shrink-0 ${isActive ? 'bg-brand-600 text-white shadow-[0_4px_20px_rgba(37,99,235,0.4)] border border-brand-400/50' : 'glass-card text-gray-400 hover:bg-white/10 hover:text-white'}`;
                btn.innerText = day;
                btn.onclick = () => { activeDay = day; renderSchedule(); };
                tabsContainer.appendChild(btn);
            });
            const activeBtn = tabsContainer.querySelector('.bg-brand-600');
            if(activeBtn) {
                tabsContainer.scrollTo({ left: activeBtn.offsetLeft - (tabsContainer.offsetWidth / 2) + (activeBtn.offsetWidth / 2), behavior: 'smooth' });
            }
        }

        function renderFocusMode() {
            const container = document.getElementById('focus-container');
            container.innerHTML = '';
            const dayData = timetableData["UG1"]?.[activeDay];
            
            if (!dayData) {
                container.innerHTML = `<div class="glass-card p-8 text-center text-gray-500 font-medium rounded-xl border-dashed animate-slide-up flex flex-col items-center"><i class="fa-solid fa-mug-hot text-3xl mb-3 text-gray-700"></i>No schedule found for this day.</div>`;
                document.getElementById('status-text').innerText = "Take a break, you have no classes."; return;
            }

            const now = new Date();
            const isToday = activeDay === daysOfWeek[now.getDay()];
            let classCount = 0; let lastClassEndTime = null; let nextClassFound = false;

            Object.keys(dayData).forEach((timeStr, index) => {
                const myClass = getMyClassForSlot(dayData[timeStr]);
                if (!myClass) return;

                const [startStr, endStr] = timeStr.split(' - ');
                const startTime = parseTime(startStr), endTime = parseTime(endStr);

                if (lastClassEndTime && startTime > lastClassEndTime) {
                    const breakMins = (startTime - lastClassEndTime) / 60000;
                    container.innerHTML += `
                        <div class="flex items-center gap-3 py-1 opacity-60 ml-8 md:ml-12 animate-slide-up" style="animation-delay: ${index * 100}ms">
                            <div class="h-6 w-px bg-dashed border-l border-dashed border-gray-500"></div>
                            <span class="text-[9px] md:text-xs font-mono font-bold text-brand-400 bg-brand-900/20 px-2 py-0.5 rounded-full border border-brand-500/20"><i class="fa-solid fa-mug-hot mr-1.5"></i>Break: ${formatDuration(breakMins)}</span>
                        </div>
                    `;
                }
                classCount++; lastClassEndTime = endTime;
                let style = colors[myClass.base] || "bg-gray-800/50 border-gray-600/50 text-gray-300";
                let statusBadge = '', cardOutline = 'border-transparent', progressHTML = '';
                
                if (isToday) {
                    if (now >= startTime && now <= endTime) {
                        const percentage = Math.min(100, Math.max(0, ((now - startTime) / 60000) / ((endTime - startTime) / 60000) * 100));
                        statusBadge = `<span class="absolute -top-2 -right-1 bg-gradient-to-r from-emerald-400 to-green-500 text-gray-900 text-[9px] tracking-widest font-extrabold px-2 py-0.5 rounded-full shadow-[0_0_15px_rgba(52,211,153,0.5)] animate-pulse-slow z-10">LIVE</span>`;
                        cardOutline = "border-emerald-500/50 shadow-[0_0_20px_rgba(16,185,129,0.15)] bg-emerald-900/10";
                        progressHTML = `<div class="mt-2 w-full bg-gray-900 rounded-full h-1 overflow-hidden border border-gray-700/50"><div class="bg-gradient-to-r from-emerald-500 to-green-400 h-1 rounded-full" style="width: ${percentage}%"></div></div>`;
                    } else if (now < startTime && !nextClassFound) {
                        statusBadge = `<span class="absolute -top-2 -right-1 bg-gradient-to-r from-amber-400 to-yellow-500 text-gray-900 text-[9px] tracking-widest font-extrabold px-2 py-0.5 rounded-full shadow-[0_0_15px_rgba(251,191,36,0.4)] z-10">NEXT</span>`;
                        cardOutline = "border-amber-500/40 bg-amber-900/5"; nextClassFound = true;
                    }
                }
                
                container.innerHTML += `
                    <div class="glass-panel glass-card rounded-xl p-3 md:p-4 relative transition-all duration-300 hover:bg-white/5 border ${cardOutline} animate-slide-up" style="animation-delay: ${index * 100}ms">
                        ${statusBadge}
                        <div class="flex items-center gap-3 md:gap-5">
                            <div class="w-24 md:w-32 flex-shrink-0 border-r border-gray-700/50 pr-2 md:pr-4 text-right">
                                <span class="text-[11px] md:text-sm font-bold text-gray-200 block tracking-tight">${startStr}</span>
                                <span class="text-[9px] md:text-xs text-brand-400 font-medium block mt-0.5">to ${endStr}</span>
                            </div>
                            <div class="flex-grow">
                                <div class="w-full rounded-lg border ${style} px-3 py-2 relative backdrop-blur-sm flex justify-between items-center gap-2">
                                    <span class="font-extrabold text-xs md:text-sm tracking-wide leading-tight">${myClass.course} ${myClass.section || ''}</span>
                                    <div class="flex items-center bg-gray-950/50 border border-white/5 px-2 py-1 rounded text-[9px] md:text-xs font-mono font-semibold text-gray-300 shadow-inner whitespace-nowrap"><i class="fa-solid fa-door-open mr-1.5 text-brand-400/80"></i>${myClass.room}</div>
                                </div>
                            </div>
                        </div>
                        ${progressHTML}
                    </div>
                `;
            });

            document.getElementById('status-text').innerText = classCount === 0 ? "Take a break, your schedule is clear." : `You have ${classCount} class${classCount > 1 ? 'es' : ''} scheduled for ${activeDay}.`;
            if (classCount === 0) container.innerHTML = `<div class="glass-card p-8 text-center text-gray-500 font-medium rounded-xl border-dashed animate-slide-up"><i class="fa-solid fa-mug-hot text-3xl mb-3 text-gray-700"></i><br>No classes scheduled today.</div>`;
        }

        function renderGridMode() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            let totalClasses = 0; const now = new Date(); const currentDayStr = daysOfWeek[now.getDay()];

            ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"].forEach((day, dayIndex) => {
                const dayData = timetableData["UG1"]?.[day];
                const isToday = day === currentDayStr;
                
                let dayHTML = `
                    <div class="glass-panel rounded-xl p-2.5 border flex flex-col h-full animate-slide-up ${isToday ? 'border-brand-500/60 shadow-[0_0_20px_rgba(59,130,246,0.15)] bg-brand-900/10' : 'border-gray-800/50 hover:border-gray-700/80'}" style="animation-delay: ${dayIndex * 50}ms">
                        <div class="flex items-center justify-between mb-2 border-b border-gray-700/50 pb-1.5">
                            <h3 class="font-extrabold text-sm ${isToday ? 'text-brand-400' : 'text-gray-200'} tracking-tight">${day}</h3>
                            ${isToday ? '<span class="bg-brand-500 text-white text-[8px] font-bold px-1.5 py-0.5 rounded shadow-[0_0_10px_rgba(59,130,246,0.5)] uppercase tracking-wider animate-pulse-slow">Today</span>' : ''}
                        </div>
                        <div class="space-y-1.5 flex-grow">
                `;

                if (!dayData) {
                    dayHTML += `<div class="p-2 text-center text-gray-500 text-[10px] font-medium rounded-lg border border-dashed border-gray-700 bg-black/20 h-full flex items-center justify-center">No classes</div></div></div>`;
                    container.innerHTML += dayHTML; return; 
                }

                let classCount = 0; let nextClassFound = false;

                Object.keys(dayData).forEach(timeStr => {
                    const myClass = getMyClassForSlot(dayData[timeStr]);
                    if (myClass) {
                        classCount++; totalClasses++;
                        const [startStr, endStr] = timeStr.split(' - ');
                        const startTime = parseTime(startStr), endTime = parseTime(endStr);
                        let style = colors[myClass.base] || "bg-gray-800/50 border-gray-600/50 text-gray-300";
                        let statusBadge = '', cardOutline = 'border-transparent', progressHTML = '';
                        
                        if (isToday) {
                            if (now >= startTime && now <= endTime) {
                                statusBadge = `<span class="absolute -top-2 -right-1.5 bg-gradient-to-r from-emerald-400 to-green-500 text-gray-900 text-[8px] tracking-widest font-extrabold px-1.5 py-0.5 rounded-full shadow-[0_0_10px_rgba(52,211,153,0.5)] z-10">LIVE</span>`;
                                cardOutline = "border-emerald-500/50 bg-emerald-900/20";
                                progressHTML = `<div class="mt-1.5 w-full bg-gray-900 rounded-full h-1 overflow-hidden border border-gray-700/50"><div class="bg-gradient-to-r from-emerald-500 to-green-400 h-1 rounded-full" style="width: ${Math.min(100, Math.max(0, ((now - startTime) / 60000) / ((endTime - startTime) / 60000) * 100))}%"></div></div>`;
                            } else if (now < startTime && !nextClassFound) {
                                statusBadge = `<span class="absolute -top-2 -right-1.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-gray-900 text-[8px] tracking-widest font-extrabold px-1.5 py-0.5 rounded-full shadow-[0_0_10px_rgba(251,191,36,0.4)] z-10">NEXT</span>`;
                                cardOutline = "border-amber-500/40 bg-amber-900/10"; nextClassFound = true;
                            }
                        }
                        
                        dayHTML += `
                            <div class="p-2 rounded-lg border ${style} ${cardOutline} relative backdrop-blur-md">
                                ${statusBadge}
                                <div class="flex justify-between items-start mb-1 gap-1">
                                    <span class="font-extrabold text-[11px] tracking-wide leading-tight">${myClass.course} ${myClass.section || ''}</span>
                                    <span class="text-[8px] font-mono bg-black/50 border border-white/10 px-1 py-0.5 rounded text-gray-300 flex-shrink-0">${myClass.room}</span>
                                </div>
                                <div class="text-[9px] font-medium opacity-75 flex items-center"><i class="fa-regular fa-clock mr-1 text-[8px] text-brand-400"></i> ${startStr.replace(/ AM| PM/g, '')} - ${endStr.replace(/ AM| PM/g, '')}</div>
                                ${progressHTML}
                            </div>
                        `;
                    }
                });

                if (classCount === 0) dayHTML += `<div class="p-2 text-center text-gray-500 text-[10px] font-medium rounded-lg border border-dashed border-gray-700 bg-black/20 h-full flex items-center justify-center">No classes</div>`;
                dayHTML += `</div></div>`;
                container.innerHTML += dayHTML;
            });
            document.getElementById('status-text').innerText = `You have ${totalClasses} total classes scheduled for this week.`;
        }

        let touchStartX = 0; let touchEndX = 0;
        const focusContainer = document.getElementById('focus-container');
        focusContainer.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
        focusContainer.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, {passive: true});

        function handleSwipe() {
            if (viewMode !== 'focus') return;
            const swipeThreshold = 50; const swipeDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const currentIndex = swipeDays.indexOf(activeDay);
            if (touchStartX - touchEndX > swipeThreshold && currentIndex < swipeDays.length - 1) { activeDay = swipeDays[currentIndex + 1]; renderSchedule(); }
            if (touchEndX - touchStartX > swipeThreshold && currentIndex > 0) { activeDay = swipeDays[currentIndex - 1]; renderSchedule(); }
        }
        
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => {}));
        initApp();
    </script>
</body>
</html>
